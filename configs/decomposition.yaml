# configs/decomposition.yaml — Claim Decomposition (Knowledge Distillation)
# Interview IQ / NLP Module
#
# ✅ Q6 resolved (decisions.md D54): AraT5-base selected on
#    linguistic-specialization grounds (pilot D53 was inconclusive
#    between candidates — see D54 for full reasoning).
#    candidate_a/candidate_b kept below for audit trail; do not remove.

model:
  candidate_a: "UBC-NLP/AraT5-base"     # option A
  candidate_b: "google/mt5-base"         # option B
  selected: "UBC-NLP/AraT5-base"         # ✅ Q6 resolved — decisions.md D54

generation:
  max_new_tokens: 128
  num_beams: 4
  early_stopping: true
  device: "cpu"     # CPU-First; GPU used on Kaggle T4 only

# The four locked annotation / composition rules (✅ pipeline spec §[2]).
# These are enforced programmatically in the dataset builder and checked
# in the human annotation guide.
annotation_rules:
  # (a) Preserve hedging words such as "غالبًا" — faithfulness
  preserve_hedging: true
  # (b) Generalise personal framing; evaluate the transferred knowledge claim
  generalise_personal_framing: true
  # (c) No third causal claim unless the causality itself is independently verifiable
  no_unverifiable_causal_bridge: true
  # (d) Every emitted claim must pass the self-containment test
  enforce_self_containment: true

output:
  claim_separator: "\n"
  include_decontextualisation_log: true

# ✅ D57 — PRE-CALIBRATION DEFAULT, مقاسة تجريبيًا عبر
# scripts/probe_token_lengths.py على الـ corpus الحقيقي (222 تدريب + 25
# Gold/Validation، AraT5-base tokenizer)، 16 يوليو 2026. خاضعة لمعايرة G4.
split:
  val_ratio: 0.15   # على مستوى question-ID من الـ 222 (build_kd_dataset)
                     # منفصل تمامًا عن O9 (Gold/Validation، D55) -- O9 لا
                     # يُستخدم أبدًا لـ early stopping
  seed: 42

tokenizer:
  max_source_length: 320   # p95=257, max=283 -- صفر truncation
  max_target_length: 320   # p95=227, max=279 -- صفر truncation

training:
  learning_rate: 3.0e-4
  lr_scheduler_type: "linear"
  warmup_ratio: 0.1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  weight_decay: 0.01
  num_train_epochs: 30            # سقف أقصى؛ early stopping متوقَّع يوقف قبله
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2      # تصحيح D57 (16 يوليو) -- ناقصة من الأصل، سببت
                             # كرش القرص عند epoch 8 على Kaggle
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  fp16: true
  early_stopping_patience: 5
  seed: 42